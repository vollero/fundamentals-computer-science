<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Source code, runtime input, and runtime output</title>
  <desc id="desc">Three horizontal lanes distinguish text written before execution, a line submitted during execution, and results leaving during execution.</desc>
  <rect width="1600" height="900" fill="#0B132B"/>
  <text x="800" y="90" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="58" font-weight="700">Keep the three channels separate</text>

  <rect x="90" y="150" width="1420" height="190" rx="24" fill="#151F3D" stroke="#FFC857" stroke-width="7"/>
  <rect x="115" y="175" width="18" height="140" fill="#FFC857"/>
  <text x="175" y="225" fill="#FFC857" font-family="sans-serif" font-size="42" font-weight="700">SOURCE CODE</text>
  <text x="175" y="285" fill="#F7F3E8" font-family="monospace" font-size="38">print("The first activity has started.")</text>
  <text x="1260" y="265" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="30">written before the run</text>

  <rect x="90" y="370" width="1420" height="190" rx="24" fill="#151F3D" stroke="#3DDCFF" stroke-width="7" stroke-dasharray="18 12"/>
  <text x="175" y="445" fill="#3DDCFF" font-family="sans-serif" font-size="42" font-weight="700">RUNTIME INPUT</text>
  <path d="M720 465 h120 m-25 -25 l25 25 -25 25" fill="none" stroke="#3DDCFF" stroke-width="8"/>
  <text x="900" y="480" fill="#F7F3E8" font-family="sans-serif" font-size="38">empty line is submitted</text>
  <text x="1260" y="515" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="30">enters during the run</text>

  <rect x="90" y="590" width="1420" height="190" rx="24" fill="#151F3D" stroke="#FF70A6" stroke-width="7"/>
  <line x1="115" y1="750" x2="1485" y2="750" stroke="#FF70A6" stroke-width="8"/>
  <text x="175" y="665" fill="#FF70A6" font-family="sans-serif" font-size="42" font-weight="700">RUNTIME OUTPUT</text>
  <text x="175" y="725" fill="#F7F3E8" font-family="monospace" font-size="38">Press Enter when you are ready.</text>
  <text x="1260" y="705" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="30">leaves during the run</text>
</svg>
