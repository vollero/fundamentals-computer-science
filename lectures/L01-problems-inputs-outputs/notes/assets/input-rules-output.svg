<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Input, rules, and output model</title>
  <desc id="desc">Information enters from the left, specified rules are carried out in the center, and observable results leave to the right. The chosen system boundary determines what counts as input and output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#F7F3E8"/>
    </marker>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#3DDCFF"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#0B132B"/>
  <text x="800" y="110" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="62" font-weight="700">A first model of computation</text>

  <rect x="90" y="280" width="390" height="310" rx="28" fill="url(#dots)" stroke="#3DDCFF" stroke-width="8"/>
  <rect x="106" y="296" width="358" height="278" rx="18" fill="#0B132B" opacity="0.94"/>
  <text x="285" y="390" text-anchor="middle" fill="#3DDCFF" font-family="sans-serif" font-size="56" font-weight="700">INPUT</text>
  <text x="285" y="465" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="36">information or events</text>
  <text x="285" y="515" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="36">enter the boundary</text>

  <rect x="605" y="230" width="390" height="410" rx="28" fill="#0B132B" stroke="#FFC857" stroke-width="12"/>
  <rect x="625" y="250" width="350" height="370" rx="17" fill="none" stroke="#FFC857" stroke-width="3"/>
  <text x="800" y="390" text-anchor="middle" fill="#FFC857" font-family="sans-serif" font-size="56" font-weight="700">RULES</text>
  <text x="800" y="465" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="36">specified actions</text>
  <text x="800" y="515" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="36">are carried out</text>

  <rect x="1120" y="280" width="390" height="310" rx="28" fill="#0B132B" stroke="#FF70A6" stroke-width="8"/>
  <line x1="1148" y1="558" x2="1482" y2="558" stroke="#FF70A6" stroke-width="9"/>
  <text x="1315" y="390" text-anchor="middle" fill="#FF70A6" font-family="sans-serif" font-size="56" font-weight="700">OUTPUT</text>
  <text x="1315" y="465" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="36">observable results</text>
  <text x="1315" y="515" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="36">leave the boundary</text>

  <line x1="490" y1="435" x2="580" y2="435" stroke="#F7F3E8" stroke-width="9" marker-end="url(#arrow)"/>
  <line x1="1005" y1="435" x2="1095" y2="435" stroke="#F7F3E8" stroke-width="9" marker-end="url(#arrow)"/>

  <text x="800" y="760" text-anchor="middle" fill="#F7F3E8" font-family="sans-serif" font-size="34">The chosen system boundary determines what counts as input and output.</text>
</svg>
